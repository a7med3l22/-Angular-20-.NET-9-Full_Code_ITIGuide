<form (ngSubmit)="login()" #form="ngForm"> 
    <!-- علان يروح للوجين لما يعمل submit -->
  <div class="form-group">
    <label for="exampleInputEmail1">Email address</label>
    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" required [(ngModel)]="usernameOrEmail" name="_email">
    <!-- 
         🔹 لكي يربطه Angular مع ngForm ويحسب صلاحيته (form.valid) يجب:

        وجود [(ngModel)].

        وجود name على العنصر.
    -->
    <small id="emailHelp" class="form-text text-muted">We'll never share your email with anyone else.</small>
  </div>
  <div class="form-group">
    <label for="exampleInputPassword1" >Password</label>
    <input type="password" class="form-control" id="exampleInputPassword1" required [(ngModel)]="password" name="_password">
  </div>
  <div class="form-group form-check">
    <input type="checkbox" [(ngModel)]="saveToLocalhost" name="saveToLocalhost" class="form-check-input" id="exampleCheck1">
    <!-- 
    سبحان الله لو شيلت ال name هيوضحلك سبب الغطأ ويديل مثال ع الحل بتاعه ف الكونسول 
    If ngModel is used within a form tag, either the name attribute must be set or the form
    control must be defined as 'standalone' in ngModelOptions.

    Example 1: <input [(ngModel)]="person.firstName" name="first">
    Example 2: <input [(ngModel)]="person.firstName" [ngModelOptions]="{standalone: true}">
    -->
    <label class="form-check-label" for="exampleCheck1">Check me out</label>
  </div>
  <button type="submit" [disabled]="!form.valid" class="btn btn-primary">Login</button>
</form>

<h3 *ngIf="error" style="color: red;">
    {{error}}
</h3>
